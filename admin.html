<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin ZAADUNA</title>
<style>
:root{
  --bg:#f6f4ee;--card:#fff;--ink:#1d2a24;--muted:#5d6b63;--accent:#0f6b4f;--accent2:#c9a24b;--line:#dcd8ca;--soft:#e8f3ee;--danger:#9b2c2c;--dangerbg:#fbeeee;--ok:#0f6b4f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1713;--card:#17231d;--ink:#e9efe9;--muted:#9fb0a5;--accent:#4fc59a;--accent2:#d8b45f;--line:#2b3d33;--soft:#1b2c24;--danger:#f0a0a0;--dangerbg:#2c1a1a;--ok:#4fc59a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;font-size:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:18px 0 8px;color:var(--accent)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 0}
label .hint{font-weight:400}
input[type=text],input[type=password],input:not([type]),textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px}
textarea{resize:vertical;min-height:44px}
textarea.rtl{direction:rtl;text-align:right;font-size:20px;line-height:1.9}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:15px}
.chk input{width:20px;height:20px;margin:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open]>summary::after{content:"−"}
details>.body{padding:0 14px 14px}
.blk{border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:10px;margin:10px 0;background:var(--card)}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.blk-h b{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.ctl{display:flex;gap:4px}
.ctl button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.ctl button.x{color:var(--danger)}
.kids{margin-top:10px;padding-left:8px;border-left:2px dashed var(--line)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow select{flex:1;margin:0}
.item{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:5}
.bar .msg{flex:1;font-size:14px;color:var(--muted)}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--danger)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.warn{background:var(--dangerbg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--danger);margin-top:10px}
ol{padding-left:20px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
/* ===== Admin ZAADUNA — mengedit isi.json langsung di GitHub ===== */
var DATA=null, SHA=null, CFG=null, dirty=false, view='situs', openSet=new Set(), filterText='', lastMsg={t:'',k:''};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function get(p){return p.split('.').reduce(function(o,k){return o[k]},DATA)}
function setv(p,v){var a=p.split('.'),l=a.pop();a.reduce(function(o,k){return o[k]},DATA)[l]=v}

var TIPE={judul:'Judul bagian',teks:'Paragraf',arab:'Teks Arab',catatan:'Catatan kecil',daftar:'Daftar poin',pembatal:'Kartu pembatal (merah)',pasangan:'Pasangan (kiri | kanan)',kartu:'Kartu (berisi blok lain)',grid:'Kolom berdampingan',lipat:'Bagian buka-tutup',nomor:'Daftar bernomor'};
var TEMPLATES={
  judul:function(){return {tipe:'judul',teks:''}},
  teks:function(){return {tipe:'teks',isi:''}},
  arab:function(){return {tipe:'arab',isi:''}},
  catatan:function(){return {tipe:'catatan',isi:''}},
  daftar:function(){return {tipe:'daftar',label:'',judul:'',isi:[]}},
  pembatal:function(){return {tipe:'pembatal',judul:'Pembatal',isi:[]}},
  pasangan:function(){return {tipe:'pasangan',label:'',isi:[]}},
  kartu:function(){return {tipe:'kartu',label:'',judul:'',isi:[]}},
  grid:function(){return {tipe:'grid',isi:[]}},
  lipat:function(){return {tipe:'lipat',judul:'',buka:false,isi:[]}},
  nomor:function(){return {tipe:'nomor',isi:[]}}
};

/* ---------- kolom isian ---------- */
function F(label,p,o){
  o=o||{}; var k=o.kind||'text', v=get(p), hint=o.hint?' <span class="hint">('+esc(o.hint)+')</span>':'';
  var a=' data-p="'+esc(p)+'" data-k="'+k+'"';
  if(k==='text') return '<label>'+esc(label)+hint+'<input type="text"'+a+' value="'+esc(v)+'"></label>';
  if(k==='bool') return '<label class="chk"><input type="checkbox"'+a+(v?' checked':'')+'> '+esc(label)+'</label>';
  var txt=v;
  if(k==='lines') txt=(v||[]).join('\n');
  if(k==='pairs') txt=(v||[]).map(function(x){return x[0]+' | '+x[1]}).join('\n');
  if(k==='nomor') txt=(v||[]).map(function(x){return x.judul+' | '+x.isi}).join('\n');
  return '<label>'+esc(label)+hint+'<textarea'+a+' rows="'+(o.rows||3)+'" class="'+(o.rtl?'rtl':'')+'">'+esc(txt)+'</textarea></label>';
}
function ctl(p){return '<span class="ctl"><button data-act="up" data-p="'+p+'" aria-label="Naik">↑</button><button data-act="down" data-p="'+p+'" aria-label="Turun">↓</button><button class="x" data-act="del" data-p="'+p+'" aria-label="Hapus">✕</button></span>'}

/* ---------- editor blok (rekursif) ---------- */
function addRow(p){
  var opts=Object.keys(TIPE).map(function(t){return '<option value="'+t+'">'+TIPE[t]+'</option>'}).join('');
  return '<div class="addrow"><select>'+opts+'</select><button class="btn sm" data-act="add" data-p="'+p+'">+ Blok</button></div>';
}
function kids(p){
  var arr=get(p);
  return '<div class="kids">'+arr.map(function(_,i){return blockHTML(p+'.'+i)}).join('')+addRow(p)+'</div>';
}
function blockHTML(p){
  var b=get(p), body='';
  switch(b.tipe){
    case 'judul': body=F('Teks judul',p+'.teks'); break;
    case 'teks': case 'catatan': body=F('Isi',p+'.isi',{kind:'area',rows:3}); break;
    case 'arab': body=F('Teks Arab',p+'.isi',{kind:'area',rows:3,rtl:1}); break;
    case 'daftar': body=F('Label kecil (boleh kosong)',p+'.label')+F('Judul (boleh kosong)',p+'.judul')+F('Poin',p+'.isi',{kind:'lines',rows:5,hint:'satu baris = satu poin'}); break;
    case 'pembatal': body=F('Judul',p+'.judul')+F('Poin',p+'.isi',{kind:'lines',rows:5,hint:'satu baris = satu poin'}); break;
    case 'pasangan': body=F('Label kecil (boleh kosong)',p+'.label')+F('Pasangan',p+'.isi',{kind:'pairs',rows:5,hint:'format: kiri | kanan'}); break;
    case 'nomor': body=F('Daftar bernomor',p+'.isi',{kind:'nomor',rows:6,hint:'format: judul | isi'}); break;
    case 'kartu': body=F('Label kecil (boleh kosong)',p+'.label')+F('Judul (boleh kosong)',p+'.judul')+kids(p+'.isi'); break;
    case 'grid': body='<div class="note" style="margin-top:8px">Blok di bawah ini ditampilkan berdampingan.</div>'+kids(p+'.isi'); break;
    case 'lipat': body=F('Judul',p+'.judul')+F('Terbuka otomatis',p+'.buka',{kind:'bool'})+kids(p+'.isi'); break;
    default: body='<div class="note">Jenis blok tidak dikenal: '+esc(b.tipe)+'</div>';
  }
  return '<div class="blk"><div class="blk-h"><b>'+esc(TIPE[b.tipe]||b.tipe)+'</b>'+ctl(p)+'</div>'+body+'</div>';
}

/* ---------- tampilan ---------- */
function viewSitus(){
  return '<div class="card">'+F('Nama situs','SITUS.nama')+F('Tulisan Arab di atas nama','SITUS.arab')+F('Subjudul','SITUS.subjudul')+F('Logo (nama file gambar, boleh kosong)','SITUS.logo',{hint:'mis. logo.png — unggah gambarnya ke GitHub dulu'})+
    F('Footer (bawah halaman)','SITUS.footer',{kind:'area',rows:3,hint:'boleh <b>tebal</b> dan <br> untuk baris baru'})+'</div>';
}
function viewHalaman(){
  var h=DATA.HALAMAN.map(function(x,i){
    var p='HALAMAN.'+i;
    var inner = x.tipe==='doa'
      ? '<div class="note" style="margin-top:8px">Isi tab ini diedit di menu <b>Do\'a Harian</b>.</div>'+F('Nama tab',p+'.judul')
      : F('Nama tab',p+'.judul')+F('Makna (kotak kuning di atas)',p+'.makna',{kind:'area',rows:3,hint:'boleh kosong'})+'<h2>Isi halaman</h2>'+kids(p+'.isi');
    return '<details data-k="'+p+'"'+(openSet.has(p)?' open':'')+'><summary><span>'+esc(x.judul)+'</span></summary><div class="body"><div style="display:flex;justify-content:flex-end;margin-top:8px">'+ctl(p)+'</div>'+inner+'</div></details>';
  }).join('');
  return h+'<button class="btn ghost" data-act="addpage">+ Tambah tab/halaman baru</button>';
}
function viewDoa(){
  var items=DATA.DOA.map(function(d,n){
    var p='DOA.'+n;
    var bac=d.i.map(function(_,j){
      var q=p+'.i.'+j;
      return '<div class="item"><div class="blk-h"><b>Bacaan '+(j+1)+'</b>'+ctl(q)+'</div>'+
        F('Sub-judul (boleh kosong, mis. Masuk / Keluar)',q+'.s')+
        F('Teks Arab',q+'.a',{kind:'area',rows:3,rtl:1})+
        F('Tulisan latin',q+'.l',{kind:'area',rows:2})+
        F('Arti',q+'.m',{kind:'area',rows:3})+'</div>';
    }).join('');
    return '<details class="doaitem" data-k="'+p+'" data-title="'+esc(d.t.toLowerCase())+'"'+(openSet.has(p)?' open':'')+'><summary><span>'+(n+1)+'. '+esc(d.t)+'</span></summary><div class="body">'+
      '<div style="display:flex;justify-content:flex-end;margin-top:8px">'+ctl(p)+'</div>'+F('Judul do\'a',p+'.t')+bac+
      '<button class="btn ghost sm" style="margin-top:10px" data-act="additem" data-p="'+p+'.i">+ Tambah bacaan</button></div></details>';
  }).join('');
  return '<button class="btn" data-act="adddoa" style="margin-bottom:10px">+ Tambah do\'a baru</button>'+
    '<input type="text" id="cari" placeholder="Cari judul do\'a…" value="'+esc(filterText)+'" style="margin-bottom:10px">'+items;
}
function loginHTML(){
  var s={}; try{s=JSON.parse(localStorage.getItem('zaaduna_admin')||'{}')}catch(e){}
  return '<div class="top"><h1>Admin ZAADUNA</h1></div>'+
  '<div class="card"><h2 style="margin-top:0">Masuk</h2>'+
  '<label>Repository GitHub<input type="text" id="repo" value="'+esc(s.repo||'nguriuriagami-dev/zaduna-web')+'" placeholder="pemilik/nama-repo"></label>'+
  '<label>Branch<input type="text" id="branch" value="'+esc(s.branch||'main')+'"></label>'+
  '<label>Token akses GitHub<input type="password" id="token" value="'+esc(s.token||'')+'" placeholder="github_pat_…" autocomplete="off"></label>'+
  '<label class="chk"><input type="checkbox" id="ingat" checked> Ingat di perangkat ini</label>'+
  '<div style="margin-top:14px"><button class="btn" data-act="login">Masuk &amp; muat isi</button></div>'+
  '<div class="msg '+lastMsg.k+'" id="loginMsg" style="margin-top:10px;font-size:14px">'+esc(lastMsg.t)+'</div></div>'+
  '<details><summary><span>Cara membuat token (sekali saja)</span></summary><div class="body"><ol>'+
  '<li>Buka github.com → foto profil → <b>Settings</b>.</li>'+
  '<li>Paling bawah: <b>Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b>.</li>'+
  '<li>Isi nama (mis. <i>admin zaaduna</i>) dan masa berlaku (mis. 90 hari).</li>'+
  '<li><b>Repository access</b>: pilih <b>Only select repositories</b>, lalu pilih repository situs ini.</li>'+
  '<li><b>Permissions → Repository permissions → Contents</b>: ubah ke <b>Read and write</b>.</li>'+
  '<li>Tekan <b>Generate token</b>, salin tulisan yang diawali <code>github_pat_</code>, lalu tempel di kolom di atas.</li></ol>'+
  '<div class="warn">Token ini sama seperti kunci rumah. Jangan dibagikan atau difoto. Token hanya dikirim ke GitHub, tidak ke tempat lain. Jika hilang atau bocor, hapus di halaman token GitHub.</div></div></details>';
}
function mainHTML(){
  var site='https://'+CFG.repo.split('/')[0]+'.github.io/'+CFG.repo.split('/')[1]+'/';
  var tabs=[['situs','Situs'],['halaman','Halaman'],['doa','Do\'a Harian']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  var v=view==='situs'?viewSitus():view==='halaman'?viewHalaman():viewDoa();
  return '<div class="top"><h1>Admin ZAADUNA</h1><span class="sp"></span><a href="'+esc(site)+'" target="_blank" rel="noopener" class="btn ghost sm" style="text-decoration:none">Lihat situs</a><button class="btn ghost sm" data-act="reload">Muat ulang</button><button class="btn danger sm" data-act="logout">Keluar</button></div>'+
    '<div class="tabs">'+tabs+'</div><div id="view">'+v+'</div>'+
    '<div class="bar"><div class="msg '+lastMsg.k+'" id="msg">'+esc(lastMsg.t)+'</div><button class="btn" id="saveBtn" data-act="save">Simpan ke GitHub</button></div>';
}
function render(){
  var y=window.scrollY;
  $('#app').innerHTML=DATA?mainHTML():loginHTML();
  window.scrollTo(0,y);
  applyFilter();
}
function msg(t,k){
  lastMsg={t:t,k:k||''};
  var m=$('#msg')||$('#loginMsg'); if(m){m.textContent=t;m.className='msg '+(k||'')}
}
function applyFilter(){
  if(view!=='doa') return;
  var f=filterText.toLowerCase().trim();
  document.querySelectorAll('.doaitem').forEach(function(d){d.style.display=(!f||d.dataset.title.indexOf(f)>=0)?'':'none'});
}

/* ---------- GitHub ---------- */
function gh(path,opt){
  opt=opt||{};
  return fetch('https://api.github.com/repos/'+CFG.repo+path,{method:opt.method||'GET',body:opt.body,cache:'no-store',headers:{
    'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
}
function b64(s){var b=new TextEncoder().encode(s),bin='';b.forEach(function(x){bin+=String.fromCharCode(x)});return btoa(bin)}
function unb64(s){var bin=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,function(c){return c.charCodeAt(0)}))}
function errText(status){
  if(status===401) return 'Token salah atau sudah kedaluwarsa. Buat token baru.';
  if(status===403) return 'Token tidak punya izin. Pastikan Contents = Read and write.';
  if(status===404) return 'Repository atau file isi.json tidak ditemukan, atau token tidak punya akses ke repository ini.';
  if(status===409||status===422) return 'Isi di GitHub sudah berubah. Tekan "Muat ulang", lalu ulangi perubahan.';
  return 'Gagal (kode '+status+').';
}
async function load(){
  var r=await gh('/contents/isi.json?ref='+encodeURIComponent(CFG.branch));
  if(!r.ok) throw new Error(errText(r.status));
  var j=await r.json();
  SHA=j.sha; DATA=JSON.parse(unb64(j.content)); dirty=false;
}
function clean(o){
  if(Array.isArray(o)){
    if(o.length&&o.every(function(x){return typeof x==='string'})) return o.map(function(s){return s.trim()}).filter(Boolean);
    return o.map(clean);
  }
  if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){
    var v=clean(o[k]); if(k==='s'&&!v) return; r[k]=v;});return r}
  return o;
}
async function save(){
  var btn=$('#saveBtn'); btn.disabled=true; msg('Menyimpan…');
  try{
    var body=JSON.stringify({message:'Update isi lewat admin',content:b64(JSON.stringify(clean(DATA),null,1)+'\n'),sha:SHA,branch:CFG.branch});
    var r=await gh('/contents/isi.json',{method:'PUT',body:body});
    if(!r.ok) throw new Error(errText(r.status));
    var j=await r.json(); SHA=j.content.sha; dirty=false;
    msg('Tersimpan. Situs akan berubah dalam 1–2 menit.','ok');
  }catch(e){msg(e.message||'Gagal menyimpan.','err')}
  btn.disabled=false;
}
async function doLogin(){
  var repo=$('#repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''), branch=$('#branch').value.trim()||'main', token=$('#token').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){msg('Isi repository dengan format pemilik/nama-repo.','err');return}
  if(!token){msg('Tempel token akses terlebih dahulu.','err');return}
  CFG={repo:repo,branch:branch,token:token}; msg('Memuat…');
  try{
    await load();
    if($('#ingat').checked){try{localStorage.setItem('zaaduna_admin',JSON.stringify(CFG))}catch(e){}}
    msg(''); render();
  }catch(e){CFG=null;msg(e.message||'Gagal masuk.','err')}
}

/* ---------- aksi ---------- */
function parentOf(p){var a=p.split('.');var i=+a.pop();return {arr:get(a.join('.')),i:i}}
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act, p=el.dataset.p;
  if(act==='login') return doLogin();
  if(act==='save') return save();
  if(act==='tab'){view=el.dataset.v;render();return}
  if(act==='logout'){
    if(dirty&&!confirm('Ada perubahan yang belum disimpan. Tetap keluar?')) return;
    try{localStorage.removeItem('zaaduna_admin')}catch(x){}
    DATA=null;CFG=null;dirty=false;lastMsg={t:'',k:''};render();return}
  if(act==='reload'){
    if(dirty&&!confirm('Perubahan yang belum disimpan akan hilang. Lanjutkan?')) return;
    msg('Memuat…'); try{await load();msg('Isi dimuat ulang dari GitHub.','ok');render()}catch(x){msg(x.message,'err')} return}
  if(act==='add'){get(p).push(TEMPLATES[el.previousElementSibling.value]());}
  else if(act==='additem'){get(p).push({s:'',a:'',l:'',m:''});}
  else if(act==='adddoa'){DATA.DOA.push({t:'Do\'a baru',i:[{s:'',a:'',l:'',m:''}]});openSet.add('DOA.'+(DATA.DOA.length-1));}
  else if(act==='addpage'){
    var np={id:'hal-'+Date.now().toString(36),judul:'Halaman baru',makna:'',isi:[]};
    var di=DATA.HALAMAN.findIndex(function(h){return h.tipe==='doa'});
    if(di<0) DATA.HALAMAN.push(np); else DATA.HALAMAN.splice(di,0,np);
  }
  else if(act==='del'){
    if(!confirm('Hapus bagian ini?')) return;
    var d=parentOf(p); d.arr.splice(d.i,1);
  }
  else if(act==='up'||act==='down'){
    var m=parentOf(p), j=m.i+(act==='up'?-1:1);
    if(j<0||j>=m.arr.length) return;
    var t=m.arr[m.i]; m.arr[m.i]=m.arr[j]; m.arr[j]=t;
    openSet.clear();
  } else return;
  dirty=true; msg('Ada perubahan yang belum disimpan.'); render();
});
function onEdit(e){
  var el=e.target; if(el.id==='cari'){filterText=el.value;applyFilter();return}
  var p=el.dataset&&el.dataset.p; if(!p) return;
  var k=el.dataset.k, v=el.value;
  var lines=function(){return v.split('\n').map(function(s){return s.trim()}).filter(Boolean)};
  var two=function(s){var i=s.indexOf('|');return i<0?[s.trim(),'']:[s.slice(0,i).trim(),s.slice(i+1).trim()]};
  if(k==='bool') v=el.checked;
  else if(k==='lines') v=lines();
  else if(k==='pairs') v=lines().map(two);
  else if(k==='nomor') v=lines().map(function(s){var t=two(s);return {judul:t[0],isi:t[1]}});
  setv(p,v); if(!dirty){dirty=true;msg('Ada perubahan yang belum disimpan.')}
}
document.addEventListener('input',onEdit);
document.addEventListener('change',function(e){if(e.target.type==='checkbox'&&e.target.dataset.k==='bool')onEdit(e)});
document.addEventListener('toggle',function(e){
  var d=e.target; if(d.tagName!=='DETAILS'||!d.dataset.k) return;
  if(d.open) openSet.add(d.dataset.k); else openSet.delete(d.dataset.k);
},true);
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

  }
