<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAADUNA — Islam, Iman, Ihsan, Akhlak & Do'a Harian</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee;--card:#ffffff;--ink:#1d2a24;--muted:#5d6b63;--accent:#0f6b4f;--accent2:#c9a24b;--line:#e3dfd2;--soft:#e8f3ee;--danger:#9b2c2c;--dangerbg:#fbeeee;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1713;--card:#17231d;--ink:#e9efe9;--muted:#9fb0a5;--accent:#4fc59a;--accent2:#d8b45f;--line:#27382f;--soft:#1b2c24;--danger:#f0a0a0;--dangerbg:#2c1a1a}
}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17231d;--ink:#e9efe9;--muted:#9fb0a5;--accent:#4fc59a;--accent2:#d8b45f;--line:#27382f;--soft:#1b2c24;--danger:#f0a0a0;--dangerbg:#2c1a1a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.65;font-size:15px}
.hero{background:linear-gradient(135deg,#0f6b4f,#0a4a37);color:#fff;text-align:center;padding:42px 20px 56px}
.hero h1{margin:0;font-size:clamp(34px,8vw,56px);letter-spacing:4px;font-weight:700}
.hero .ar{font-family:'Amiri',serif;font-size:28px;color:#f1d48a;margin-top:6px}
.hero img.logo{display:block;max-width:min(340px,82%);height:auto;margin:0 auto 6px}
.sr{position:absolute;left:-9999px}
.hero p{max-width:560px;margin:12px auto 0;opacity:.92}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;margin-top:-22px;border-radius:18px 18px 0 0}
nav button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:8px 16px;border-radius:999px;cursor:pointer}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
nav .theme{margin-left:auto}
main{max-width:860px;margin:0 auto;padding:20px 14px 40px}
section{display:none}
section.active{display:block}
h2{font-size:24px;margin:8px 0 14px;color:var(--accent)}
h3{font-size:17px;margin:0 0 8px}
h3.judul{margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.makna{border-left:5px solid var(--accent2);background:var(--soft)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
ul{margin:6px 0 0;padding-left:20px}
li{margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:8px 0 12px}
.grid>.card{margin:0}
.pair{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border:0}
.pair b{color:var(--accent)}
.pair span{color:var(--danger);text-align:right}
.pembatal{background:var(--dangerbg);border-color:transparent}
.pembatal h3{color:var(--danger)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details .body{padding:0 16px 16px}
.arab{font-family:'Amiri','Traditional Arabic','Scheherazade New',serif;font-size:27px;line-height:2.1;direction:rtl;text-align:right;margin:6px 0;color:var(--ink)}
.latin{font-style:italic;color:var(--accent);margin:4px 0}
.arti{color:var(--muted);font-size:14px}
.teks{margin:0 0 8px}
.doa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.doa h3{color:var(--accent)}
.doa .sub{font-size:12px;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.6px;margin-top:10px}
.search{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:14px}
.nomor{counter-reset:r}
.nomor .card{position:relative;padding-left:58px}
.nomor .card::before{counter-increment:r;content:counter(r);position:absolute;left:14px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);padding:10px 14px;border-radius:10px;margin-top:16px}
footer{text-align:center;color:var(--muted);padding:24px 14px 36px;font-size:13px;border-top:1px solid var(--line)}
footer b{letter-spacing:3px;color:var(--accent)}
.empty{display:none;text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>

<header class="hero">
  <img class="logo" id="siteLogo" alt="" hidden>
  <div class="ar" id="siteArab"></div>
  <h1 id="siteNama"></h1>
  <p id="siteSub"></p>
</header>
<nav id="tabs"></nav>
<main id="konten"></main>
<footer id="siteFooter"></footer>

<script>
fetch('isi.json?v='+Date.now()).then(function(r){if(!r.ok)throw new Error('x');return r.json()}).then(function(D){
const SITUS=D.SITUS,HALAMAN=D.HALAMAN,DOA=D.DOA;
/* ==========================================================================
   KODE TAMPILAN — JANGAN DIUBAH
   ========================================================================== */
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

function blok(b){
  switch(b.tipe){
    case 'judul':   return '<h3 class="judul">'+fmt(b.teks)+'</h3>';
    case 'teks':    return '<p class="teks">'+fmt(b.isi)+'</p>';
    case 'arab':    return '<div class="arab">'+esc(b.isi)+'</div>';
    case 'catatan': return '<p class="note">'+fmt(b.isi)+'</p>';
    case 'daftar':
      return '<div class="card">'+(b.label?'<span class="tag">'+esc(b.label)+'</span>':'')+(b.judul?'<h3>'+fmt(b.judul)+'</h3>':'')+
             '<ul>'+b.isi.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul></div>';
    case 'pembatal':
      return '<div class="card pembatal"><h3>'+fmt(b.judul||'Pembatal')+'</h3><ul>'+b.isi.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul></div>';
    case 'pasangan':
      return (b.label?'<span class="tag">'+esc(b.label)+'</span>':'')+b.isi.map(p=>'<div class="pair"><b>'+fmt(p[0])+'</b><span>'+fmt(p[1])+'</span></div>').join('');
    case 'kartu':
      return '<div class="card">'+(b.label?'<span class="tag">'+esc(b.label)+'</span>':'')+(b.judul?'<h3>'+fmt(b.judul)+'</h3>':'')+b.isi.map(blok).join('')+'</div>';
    case 'grid':  return '<div class="grid">'+b.isi.map(blok).join('')+'</div>';
    case 'lipat':
      return '<details'+(b.buka?' open':'')+'><summary>'+fmt(b.judul)+'</summary><div class="body">'+b.isi.map(blok).join('')+'</div></details>';
    case 'nomor':
      return '<div class="nomor">'+b.isi.map(x=>'<div class="card"><h3>'+fmt(x.judul)+'</h3><p class="arti" style="margin:0">'+fmt(x.isi)+'</p></div>').join('')+'</div>';
    default: return '';
  }
}

/* Situs */
document.title=SITUS.nama+' — '+SITUS.subjudul;
document.getElementById('siteArab').textContent=SITUS.arab;
document.getElementById('siteNama').textContent=SITUS.nama;
if(SITUS.logo){
  const lg=document.getElementById('siteLogo'), nm=document.getElementById('siteNama');
  lg.onerror=()=>{lg.hidden=true;nm.classList.remove('sr')};
  lg.src=SITUS.logo; lg.alt=SITUS.nama; lg.hidden=false; nm.classList.add('sr');
}
document.getElementById('siteSub').textContent=SITUS.subjudul;
document.getElementById('siteFooter').innerHTML=SITUS.footer;

/* Halaman */
const konten=document.getElementById('konten'), tabs=document.getElementById('tabs');
HALAMAN.forEach((h,i)=>{
  const btn=document.createElement('button');
  btn.textContent=h.judul; btn.dataset.t=h.id; if(i===0) btn.className='active';
  btn.addEventListener('click',()=>show(h.id));
  tabs.appendChild(btn);

  const s=document.createElement('section'); s.id=h.id; if(i===0) s.className='active';
  let html='<h2>'+esc(h.judul)+'</h2>';
  if(h.tipe==='doa'){
    html+='<input class="search" id="q" type="search" placeholder="Cari do\'a (mis. makan, tidur, hujan)…"><div id="doaList"></div><div class="empty" id="empty">Do\'a tidak ditemukan.</div>';
  }else{
    if(h.makna) html+='<div class="card makna"><span class="tag">Makna '+esc(h.judul)+'</span><p style="margin:0">'+fmt(h.makna)+'</p></div>';
    html+=(h.isi||[]).map(blok).join('');
  }
  s.innerHTML=html; konten.appendChild(s);
});

const themeBtn=document.createElement('button');
themeBtn.className='theme'; themeBtn.id='themeBtn'; themeBtn.textContent='◐'; themeBtn.setAttribute('aria-label','Ganti tema');
themeBtn.addEventListener('click',()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'light':'dark';
});
tabs.appendChild(themeBtn);

function show(id){
  tabs.querySelectorAll('button[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===id));
  konten.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===id));
  window.scrollTo({top:0});
}

/* Do'a */
const list=document.getElementById('doaList'), empty=document.getElementById('empty');
function renderDoa(f){
  if(!list) return;
  f=(f||'').toLowerCase().trim(); let html='',n=0;
  DOA.forEach((d,idx)=>{
    if(f && !d.t.toLowerCase().includes(f) && !d.i.some(x=>((x.m||'')+(x.l||'')).toLowerCase().includes(f))) return;
    n++;
    html+='<div class="doa"><h3>'+(idx+1)+'. '+esc(d.t)+'</h3>'+d.i.map(x=>
      (x.s?'<div class="sub">'+esc(x.s)+'</div>':'')+
      '<div class="arab">'+esc(x.a)+'</div><div class="latin">'+esc(x.l)+'</div><div class="arti">'+esc(x.m)+'</div>'
    ).join('')+'</div>';
  });
  list.innerHTML=html; empty.style.display=n?'none':'block';
}
renderDoa();
const q=document.getElementById('q'); if(q) q.addEventListener('input',e=>renderDoa(e.target.value));

}).catch(function(){document.body.innerHTML='<p style="padding:20px">Isi situs gagal dimuat. Pastikan file isi.json ada di folder yang sama dengan index.html, dan buka situs lewat alamat https (bukan membuka file langsung).</p>';});
</script>
</body>
</html>
